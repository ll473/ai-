services:
  - type: web
    name: ai-commerce
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    preDeployCommand: python -m backend.scripts.init_db && python -m backend.scripts.seed_demo
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ai-commerce-db
          property: connectionString
      - key: CORS_ORIGINS
        value: ""
databases:
  - name: ai-commerce-db
    plan: free
    databaseName: ai_commerce
    user: ai_commerce
